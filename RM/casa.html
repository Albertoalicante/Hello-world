<style>
  /* Estilo para que el botón flote sobre el modelo */
  .boton-ar {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: sans-serif;
    font-weight: bold;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    cursor: pointer;
  }

  /* Esto posiciona el botón en la parte inferior de la pantalla del móvil */
  #btn-contenedor {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
  }
</style>

<div id="card" style="position: relative;">
  
  <model-viewer id="modeloCasa"
    style="width: 100%; height: 500px;"
    src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"	 
    ar 
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    shadow-intensity="1">

    <div id="btn-contenedor" slot="ui">
      <button id="btn-animacion" class="boton-ar">▶ REPRODUCIR</button>
    </div>

    <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
    </div>
  </model-viewer>

</div>

<script>
  const modelViewer = document.querySelector("#modeloCasa");
  const boton = document.querySelector("#btn-animacion");

  boton.addEventListener("click", (event) => {
    // Evitamos que el clic "atraviese" el botón y mueva el modelo
    event.stopPropagation();

    if (modelViewer.paused) {
      modelViewer.play();
      boton.textContent = "⏸ PAUSAR";
      boton.style.backgroundColor = "#ff4757"; // Cambia a rojo al pausar
    } else {
      modelViewer.pause();
      boton.textContent = "▶ REPRODUCIR";
      boton.style.backgroundColor = "#007bff"; // Vuelve a azul
    }
  });
</script>
