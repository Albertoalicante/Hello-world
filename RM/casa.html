<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa FEBER Plegable WIP</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f0f0f0; }
        
        #card {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            height: 500px;
            background: #fff;
            border-radius: 12px;
            position: relative; /* Importante para el posicionamiento */
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* ESTILO CRÍTICO PARA ANDROID */
        #btn-animacion {
            position: absolute;
            bottom: 50px; /* Separado del borde inferior */
            left: 50%;
            transform: translateX(-50%);
            z-index: 100; /* Asegura que esté por encima del canvas */
            
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: auto; /* Fuerza que responda a clics */
            display: block !important; /* Evita que se oculte */
        }

        #btn-animacion:active { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>Casa FEBER Plegable</h1>
    <p>Toca el botón azul para mover la casa.</p>

    <div id="card">
        <model-viewer id="modeloCasa"
            src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            shadow-intensity="1"
            auto-rotate>

            <button id="btn-animacion" slot="ui">
                ▶ REPRODUCIR
            </button>

            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
        </model-viewer>
    </div>

    <script>
        const modelViewer = document.querySelector("#modeloCasa");
        const boton = document.querySelector("#btn-animacion");

        boton.addEventListener("click", (event) => {
            // Evita que el clic sea ignorado por el visor 3D
            event.preventDefault();
            event.stopPropagation();

            if (modelViewer.paused) {
                modelViewer.play();
                boton.textContent = "⏸ PAUSAR";
                boton.style.backgroundColor = "#dc3545"; // Rojo al reproducir
            } else {
                modelViewer.pause();
                boton.textContent = "▶ REPRODUCIR";
                boton.style.backgroundColor = "#007bff"; // Azul al pausar
            }
        });
    </script>
</body>
</html>
