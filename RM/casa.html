<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa FEBER - Test EventListeners</title>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { margin: 0; font-family: sans-serif; background: #ccc; }
        
        .viewer-wrapper {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }

        /* PANEL DE CONTROLES EXTERNO */
        #panel-controles {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 350px;
            background: #fff;
            padding: 20px;
            border: 3px solid #000; /* Borde negro para que se vea sí o sí */
            border-radius: 15px;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .botones { display: flex; gap: 10px; }

        #btn-play { background: #28a745; color: white; padding: 15px; border: none; border-radius: 5px; flex: 1; font-weight: bold; cursor: pointer; }
        #btn-pause { background: #dc3545; color: white; padding: 15px; border: none; border-radius: 5px; flex: 1; font-weight: bold; cursor: pointer; }
        
        input[type="range"] { width: 100%; height: 20px; }

        /* Botón AR obligatorio */
        #ar-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="viewer-wrapper">
        <model-viewer id="modelo"
            src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            autoplay
            shadow-intensity="1">
            
            <button slot="ar-button" id="ar-button">📦 VER EN AR</button>
        </model-viewer>

        <div id="panel-controles">
            <div style="text-align: center; font-weight: bold; margin-bottom: 5px;">
                Velocidad: <span id="txt-velocidad">1.0</span>x
            </div>
            
            <input type="range" id="selector-velocidad" min="0" max="2" step="0.1" value="1">
            
            <div class="botones">
                <button id="btn-play">PLAY</button>
                <button id="btn-pause">PAUSA</button>
            </div>
        </div>
    </div>

    <script>
        // Esperamos a que TODA la página cargue
        window.addEventListener('load', () => {
            console.log("Página cargada. Configurando Event Listeners...");

            const casa = document.getElementById('modelo');
            const slider = document.getElementById('selector-velocidad');
            const etiqueta = document.getElementById('txt-velocidad');
            const btnPlay = document.getElementById('btn-play');
            const btnPause = document.getElementById('btn-pause');

            // 1. Event Listener para el Slider
            slider.addEventListener('input', () => {
                const valor = slider.value;
                casa.timeScale = valor;
                etiqueta.innerText = valor;
                console.log("Velocidad cambiada a:", valor);
            });

            // 2. Event Listener para el botón Play
            btnPlay.addEventListener('click', () => {
                casa.play();
                casa.timeScale = 1;
                slider.value = 1;
                etiqueta.innerText = "1.0";
            });

            // 3. Event Listener para el botón Pausa
            btnPause.addEventListener('click', () => {
                casa.pause();
                casa.timeScale = 0;
                slider.value = 0;
                etiqueta.innerText = "0";
            });

            // Evitar que el panel interfiera con el giro de la casa
            const panel = document.getElementById('panel-controles');
            panel.addEventListener('pointerdown', (e) => e.stopPropagation());
            panel.addEventListener('mousedown', (e) => e.stopPropagation());
        });
    </script>

</body>
</html>
