<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Control Total</title>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        :not(:defined) > * { display: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            --poster-color: #ffffff;
        }

        /* Panel de control flotante */
        #controls {
            position: absolute;
            bottom: 44px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 15px;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 100;
            pointer-events: auto; /* Permite interactuar con el panel */
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        input[type="range"] { width: 100%; cursor: pointer; }

        /* Estilo para el botón de AR nativo de Google */
        #ar-button {
            background-image: url(https://modelviewer.dev/assets/ic_view_in_ar_new_googblue_48dp.png);
            background-repeat: no-repeat;
            background-size: 20px 20px;
            background-position: 12px 50%;
            background-color: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            bottom: 180px; /* Lo ponemos arriba del panel de control */
            padding: 0px 16px 0px 40px;
            font-family: Roboto Regular, Helvetica Neue, sans-serif;
            font-size: 14px;
            color: #4285f4;
            height: 36px;
            line-height: 36px;
            border-radius: 18px;
            border: 1px solid #DADCE0;
            display: block;
            z-index: 101;
        }
    </style>
</head>
<body>

    <model-viewer 
        id="modeloCasa"
        src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        autoplay
        shadow-intensity="1"
        environment-image="neutral"
        exposure="1">

        <button slot="ar-button" id="ar-button">
            VER EN TU ESPACIO
        </button>

        <div id="controls" slot="ui">
            <div class="row">
                <span>Velocidad:</span>
                <span id="speed-value">1.0x</span>
            </div>
            <input type="range" id="speed-slider" min="0" max="2" step="0.1" value="1">
            
            <div class="row" style="margin-top:5px;">
                <button id="btn-pause" style="flex:1; margin-right:5px;">Pausa</button>
                <button id="btn-play" style="flex:1;">Play</button>
            </div>
        </div>

    </model-viewer>

    <script>
        const modelViewer = document.querySelector("#modeloCasa");
        const speedSlider = document.querySelector("#speed-slider");
        const speedValue = document.querySelector("#speed-value");
        const btnPause = document.querySelector("#btn-pause");
        const btnPlay = document.querySelector("#btn-play");

        // Cambiar velocidad
        speedSlider.addEventListener("input", () => {
            const val = speedSlider.value;
            modelViewer.timeScale = val;
            speedValue.textContent = val + "x";
        });

        // Botón Pausa (Velocidad 0)
        btnPause.addEventListener("click", () => {
            modelViewer.timeScale = 0;
            speedSlider.value = 0;
            speedValue.textContent = "0x";
        });

        // Botón Play (Velocidad 1)
        btnPlay.addEventListener("click", () => {
            modelViewer.timeScale = 1;
            speedSlider.value = 1;
            speedValue.textContent = "1.0x";
        });
    </script>
</body>
</html>
