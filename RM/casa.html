<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa FEBER - Test Final</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; }
        
        /* Contenedor del visor */
        .wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
        }

        /* PANEL DE CONTROLES - Estilo ultra-compatible */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background-color: white; /* Color sólido, sin transparencias */
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            z-index: 999; /* Por encima de todo */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Botón AR estilo nativo pero posicionado más arriba */
        #ar-button {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
        }

        input[type="range"] {
            width: 80%;
            height: 30px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <model-viewer id="casa"
            src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            autoplay
            shadow-intensity="1">

            <button slot="ar-button" id="ar-button">
                VER EN REALIDAD AUMENTADA
            </button>

            <div class="controls" slot="ui" id="panel-controles">
                <div style="margin-bottom: 10px;">VELOCIDAD: <span id="val">1.0</span>x</div>
                <input type="range" id="slider" min="0" max="2" step="0.1" value="1">
                
                <div style="margin-top: 10px;">
                    <button id="btn-0" style="padding: 10px;">PARAR</button>
                    <button id="btn-1" style="padding: 10px;">PLAY</button>
                </div>
            </div>

        </model-viewer>
    </div>

    <script>
        const model = document.querySelector('#casa');
        const slider = document.querySelector('#slider');
        const valText = document.querySelector('#val');
        const pnl = document.querySelector('#panel-controles');

        // Asegurar que el panel se vea después de cargar
        model.addEventListener('load', () => {
            pnl.style.display = 'flex';
            console.log("Cargado");
        });

        slider.addEventListener('input', (e) => {
            const v = e.target.value;
            model.timeScale = v;
            valText.textContent = v;
        });

        document.querySelector('#btn-0').onclick = () => {
            model.timeScale = 0;
            slider.value = 0;
            valText.textContent = "0";
        };

        document.querySelector('#btn-1').onclick = () => {
            model.timeScale = 1;
            slider.value = 1;
            valText.textContent = "1.0";
        };
    </script>
</body>
</html>
