<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa FEBER Plegable</title>

    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #f0f0f0;
        }

        .header { padding: 20px; text-align: center; }

        /* Contenedor principal */
        #container {
            position: relative;
            width: 90vw;
            height: 70vh;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 15px;
            overflow: visible; /* IMPORTANTE: Permitir que el botón se vea */
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* BOTÓN FLOTANTE: Estilo reforzado */
        #btn-animacion {
            /* Posicionamiento */
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999 !important; /* Por encima de todo */
            
            /* Apariencia */
            display: block;
            padding: 15px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            
            /* Interacción */
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Estilo cuando está en reproducción */
        #btn-animacion.playing {
            background-color: #ff4757;
        }

        /* Ocultar la barra de progreso por si estorba */
        .progress-bar { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Casa FEBER Plegable</h1>
        <p>Si no ves el botón, intenta recargar la página.</p>
    </div>

    <div id="container">
        <model-viewer id="modeloCasa"
            src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"
            ar
            ar-modes="webxr scene-viewer quick-look"
            camera-controls
            shadow-intensity="1"
            auto-rotate>

            <button id="btn-animacion" slot="ui">
                ▶ REPRODUCIR ANIMACIÓN
            </button>

        </model-viewer>
    </div>

    <script>
        // Esperamos a que el componente esté listo
        const modelViewer = document.querySelector("#modeloCasa");
        const boton = document.querySelector("#btn-animacion");

        boton.addEventListener("click", (event) => {
            // Detenemos la propagación para que el modelo no reciba el "tap"
            event.stopPropagation();
            event.preventDefault();

            if (modelViewer.paused) {
                modelViewer.play();
                boton.textContent = "⏸ PAUSAR ANIMACIÓN";
                boton.classList.add("playing");
            } else {
                modelViewer.pause();
                boton.textContent = "▶ REPRODUCIR ANIMACIÓN";
                boton.classList.remove("playing");
            }
        });

        // Verificación por consola para diagnóstico
        modelViewer.addEventListener('load', () => {
            console.log("Modelo cargado. Animaciones disponibles:", modelViewer.availableAnimations);
        });
    </script>
</body>
</html>
