<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa FEBER - Estilo Google Oficial</title>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { margin: 0; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 100vh; background-color: #eee; }

        /* Estilo 'Glass' del ejemplo de Google */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }

        .controls label {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: #444;
        }

        input[type="range"] { width: 100%; cursor: pointer; }

        #ar-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 20px;
            z-index: 101;
        }
    </style>
</head>
<body>

    <model-viewer id="append-demo" 
        camera-controls 
        touch-action="pan-y" 
        ar 
        ar-modes="webxr scene-viewer" 
        shadow-intensity="1" 
        src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"
        alt="Casa FEBER Plegable">
        
        <button slot="ar-button" id="ar-button">📦 VER EN AR</button>
        
        <div class="controls">
            </div>
    </model-viewer>

    <script>
      (() => {
        const modelViewer = document.querySelector('#append-demo');
        const controlsPanel = document.querySelector('#append-demo .controls');

        // Esta función se activa cuando el modelo termina de cargar
        modelViewer.addEventListener("load", loadModelAnimations);

        function loadModelAnimations() {
          // Limpiamos el panel
          controlsPanel.innerHTML = "";
          
          console.log("Animaciones detectadas:", modelViewer.availableAnimations);

          // Recorremos las animaciones que trae el archivo .glb de la casa
          modelViewer.availableAnimations.forEach(animationName => {
            // Creamos un slider por cada animación encontrada (excepto poses estáticas)
            if (animationName !== "TPose") {
              controlsPanel.innerHTML += `
                <label for="${animationName}">${animationName}</label>
                <input id="${animationName}" type="range" min="0" max="1" step="0.01" value="0">
              `;
            }
          });

          // Ponemos a escuchar a todos los sliders creados
          controlsPanel.querySelectorAll("input[type='range']").forEach(slider => {
            slider.addEventListener("input", updateAnimation);
          });
        }

        function updateAnimation(event) {
          // El método clave de Google: appendAnimation
          // Controla el "peso" de la animación (0 es cerrada, 1 es abierta)
          modelViewer.appendAnimation(event.target.id, {
            weight: parseFloat(event.target.value)
          });
        }

        // Bloqueamos que el toque en los controles mueva la casa
        controlsPanel.addEventListener('pointerdown', (e) => e.stopPropagation());

      })();
    </script>
</body>
</html>
