<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casa FEBER - Control Pro</title>
    
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { margin: 0; background-color: #f7f7f7; }

        /* Contenedor principal */
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #eee;
        }

        /* ESTILO COPIADO DEL EJEMPLO DE GOOGLE */
        .controls {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            bottom: 32px; /* Separación del borde inferior */
            left: 50%;
            transform: translateX(-50%);
            padding: 8px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .controls > div {
            margin: 5px 0;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }

        /* Botón AR estilo nativo */
        #ar-button {
            background-image: url(https://modelviewer.dev/assets/ic_view_in_ar_new_googblue_48dp.png);
            background-repeat: no-repeat;
            background-size: 20px 20px;
            background-position: 12px 50%;
            background-color: #fff;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            bottom: 150px; /* Encima de los controles */
            padding: 0px 16px 0px 40px;
            font-family: Roboto Regular, Helvetica Neue, sans-serif;
            font-size: 14px;
            color: #4285f4;
            height: 36px;
            line-height: 36px;
            border-radius: 18px;
            border: 1px solid #DADCE0;
            display: block;
        }

        select, input[type="range"] {
            width: 200px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="container">
    <model-viewer 
        id="casaModel"
        src="https://albertoalicante.github.io/Hello-world/modelos/Casja_Plegable_Visor45b.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        autoplay
        shadow-intensity="1">

        <button slot="ar-button" id="ar-button">
            VER EN TU CASA
        </button>

        <div class="controls" slot="ui">
            <div>Velocidad de Animación</div>
            <input type="range" id="speed-range" min="0" max="2" step="0.1" value="1">
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="pause-btn">Pausar</button>
                <button id="play-btn">Play (1x)</button>
            </div>
        </div>

    </model-viewer>
</div>

<script>
    const modelViewer = document.querySelector('#casaModel');
    const speedRange = document.querySelector('#speed-range');
    const pauseBtn = document.querySelector('#pause-btn');
    const playBtn = document.querySelector('#play-btn');

    // Cambiar velocidad
    speedRange.addEventListener('input', (event) => {
        modelViewer.timeScale = event.target.value;
    });

    // Pausar
    pauseBtn.addEventListener('click', () => {
        modelViewer.timeScale = 0;
        speedRange.value = 0;
    });

    // Reanudar
    playBtn.addEventListener('click', () => {
        modelViewer.timeScale = 1;
        speedRange.value = 1;
    });

    // Diagnóstico rápido para Javi: ver animaciones en consola
    modelViewer.addEventListener('load', () => {
        console.log("Animaciones detectadas:", modelViewer.availableAnimations);
    });
</script>

</body>
</html>
